<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>DreamSave – Deine Sparziele</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#252521;background:#f7f5f0}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}main{max-width:720px;margin:auto;padding:22px 18px 110px}header{display:flex;justify-content:space-between;align-items:center;margin:12px 0 26px}h1{font-size:30px;letter-spacing:-1.3px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0}p{line-height:1.45}.muted{color:#79776f}.tiny{font-size:12px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#7e796d;font-weight:700}.card{background:white;border:1px solid #e8e5dd;border-radius:22px;padding:20px;margin:13px 0;box-shadow:0 6px 24px #28251805}.hero{background:#302f2b;color:white;padding:25px}.hero .muted{color:#d1cec6}.big{font-size:33px;letter-spacing:-1px;font-weight:750;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:12px}.pill{border:1px solid #e6e3dc;border-radius:999px;padding:7px 11px;background:#f8f7f4;font-size:12px}.progress{height:9px;background:#e9e6df;border-radius:99px;overflow:hidden;margin:15px 0}.fill{height:100%;background:#a8aa8e;border-radius:99px;transition:width .3s}.hero .progress{background:#5a5954}.hero .fill{background:#d4d8b3}.btn{border:0;background:#30302c;color:white;padding:12px 16px;border-radius:13px;font-weight:650}.btn.secondary{background:#f0eee8;color:#34342e}.btn.danger{background:#fce9e7;color:#a33c35}.btn:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.goal{border-left:4px solid #c1c3a4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f7f6f2;padding:14px;border-radius:14px}.stat strong{display:block;font-size:19px;margin-top:5px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e2da;display:flex;justify-content:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}.tabs button{flex:1;max-width:160px;border:0;background:none;color:#79776f;font-size:12px;padding:7px 3px;border-radius:12px}.tabs button.active{background:#eeece6;color:#282821;font-weight:750}.hidden{display:none!important}dialog{border:0;border-radius:22px;padding:0;width:min(92vw,480px);max-height:85vh;overflow:auto;box-shadow:0 15px 80px #0003}dialog::backdrop{background:#0007}.modal{padding:22px}label{display:block;font-size:13px;font-weight:650;margin:14px 0 5px}input,select{width:100%;padding:12px;border:1px solid #dedbd3;border-radius:11px;background:white;color:#252521;font-size:16px}input[type=checkbox]{width:auto}.formfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.notice{padding:13px;background:#f2f1e9;border-radius:13px;font-size:13px}.transaction{padding:12px 0;border-bottom:1px solid #efede8}.transaction:last-child{border:0}.positive{color:#477251}.negative{color:#a75043}.barrow{display:grid;grid-template-columns:80px 1fr 54px;gap:9px;align-items:center;margin:13px 0;font-size:12px}.bar{height:12px;background:#eeece5;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#a5a88b}.empty{text-align:center;padding:30px 12px;color:#817e74}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#302f2b;color:#fff;border-radius:12px;padding:12px 18px;z-index:9;max-width:90vw}.sr{position:absolute;left:-10000px}@media(min-width:600px){main{padding-top:35px}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main><header><div><div class="eyebrow">Dein Geld. Deine Träume.</div><h1>DreamSave<span style="color:#a2a58b">.</span></h1></div><button class="btn secondary" id="newGoalTop" aria-label="Neues Sparziel">＋ Ziel</button></header><section id="dashboard"></section><section id="goals" class="hidden"></section><section id="stats" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs" aria-label="Navigation"><button data-tab="dashboard" class="active">⌂<br>Übersicht</button><button data-tab="goals">◎<br>Ziele</button><button data-tab="stats">▥<br>Statistik</button><button data-tab="settings">⚙<br>Einstellungen</button></nav><dialog id="modal"><div class="modal"><div class="row"><h2 id="modalTitle">Neues Ziel</h2><button class="btn secondary" id="closeModal" aria-label="Schliessen">✕</button></div><form id="modalForm"></form></div></dialog><div id="toast" class="toast hidden" role="status"></div><script>
(()=>{'use strict';const KEY='dreamsave-v1';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('de-CH',{style:'currency',currency:'CHF',maximumFractionDigits:2}).format(n);const dateLabel=s=>new Date(s+'T12:00:00').toLocaleDateString('de-CH');const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={goals:[],transactions:[],reminders:false,lastReminder:''};try{let raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.goals)&&Array.isArray(raw.transactions))state={...state,...raw}}catch(e){}let tab='dashboard';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Speichern fehlgeschlagen. Bitte Speicherplatz prüfen.');return false}};const toast=t=>{const el=$('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3500)};const balance=id=>state.transactions.filter(t=>t.goalId===id).reduce((a,t)=>a+Number(t.amount),0);const total=()=>state.goals.reduce((a,g)=>a+balance(g.id),0);const percent=g=>Math.max(0,Math.min(100,100*balance(g.id)/g.target));const days=g=>Math.ceil((new Date(g.deadline+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);const months=g=>Math.max(1,Math.ceil(Math.max(0,days(g))/30.4375));const rate=g=>Math.max(0,g.target-balance(g.id))/months(g);const milestones=[25,50,75,100];function goalCard(g){let b=balance(g.id),p=percent(g),remaining=Math.max(0,g.target-b);let reached=milestones.filter(x=>p>=x);return `<article class="card goal"><div class="row"><div><h3>${esc(g.name)}</h3><div class="muted tiny">Zieltermin: ${dateLabel(g.deadline)}</div></div><span class="pill">${Math.round(p)} %</span></div><div class="progress"><div class="fill" style="width:${p}%"></div></div><div class="row"><strong>${money(b)}</strong><span class="muted tiny">von ${money(g.target)}</span></div><div class="grid" style="margin-top:15px"><div class="stat"><span class="muted tiny">Noch offen</span><strong>${money(remaining)}</strong></div><div class="stat"><span class="muted tiny">Pro Monat</span><strong>${money(rate(g))}</strong></div></div><p class="tiny muted">${p>=100?'🎉 Ziel erreicht! Fantastisch!':days(g)<0?'⏳ Termin vorbei – passe dein Datum an.':days(g)===0?'📅 Zieltermin ist heute.':`Noch ${days(g)} Tage · ${reached.length?`🏅 Meilenstein ${reached.at(-1)} % erreicht`:'Dein erster Meilenstein wartet bei 25 %.'}`}</p><div class="actions"><button class="btn" data-action="deposit" data-id="${g.id}">＋ Einzahlung</button><button class="btn secondary" data-action="withdraw" data-id="${g.id}">− Auszahlung</button><button class="btn secondary" data-action="edit" data-id="${g.id}">Bearbeiten</button></div></article>`}function dashboard(){let target=state.goals.reduce((a,g)=>a+g.target,0),saved=total(),p=target?Math.max(0,Math.min(100,saved/target*100)):0;return `<div class="card hero"><div class="eyebrow" style="color:#d7d4c9">Dein Sparfortschritt</div><div class="big">${money(saved)}</div><div class="muted">von ${money(target)} geplant</div><div class="progress"><div class="fill" style="width:${p}%"></div></div><div class="row"><span>${Math.round(p)} % geschafft</span><span>${state.goals.length} Sparziel${state.goals.length===1?'':'e'}</span></div></div><div class="card"><div class="eyebrow">Dein kleiner Motivationskick</div><p style="margin-bottom:0">${state.goals.length===0?'Jeder grosse Traum beginnt mit einem ersten Ziel. ✨':p>=100?'Du hast deine Ziele erreicht. Das darf gefeiert werden! 🎉':p>=50?'Mehr als die Hälfte geschafft – du bist auf Kurs! 🌿':'Kleine Schritte zählen. Jeder Franken bringt dich deinem Traum näher. ✨'}</p></div><div class="row" style="margin-top:27px"><h2>Deine Sparziele</h2><button class="btn secondary" data-action="new">＋ Hinzufügen</button></div>${state.goals.length?state.goals.map(goalCard).join(''):'<div class="card empty">Noch keine Ziele. Erstelle dein erstes Sparziel und starte heute.</div>'}`};function goals(){return `<div class="row"><h2>Alle Sparziele</h2><button class="btn" data-action="new">＋ Neues Ziel</button></div>${state.goals.length?state.goals.map(goalCard).join(''):'<div class="card empty">Noch keine Sparziele vorhanden.</div>'}<h2 style="margin-top:28px">Letzte Buchungen</h2><div class="card">${state.transactions.length?state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-b.created).slice(0,15).map(t=>`<div class="transaction row"><div><strong>${esc(state.goals.find(g=>g.id===t.goalId)?.name||'Gelöschtes Ziel')}</strong><div class="muted tiny">${dateLabel(t.date)} · ${esc(t.note||'Buchung')}</div></div><div style="text-align:right"><strong class="${t.amount>=0?'positive':'negative'}">${t.amount>=0?'+':''}${money(t.amount)}</strong><div><button class="btn secondary tiny" data-action="deleteTransaction" data-id="${t.id}" style="padding:5px 9px;margin-top:5px">Löschen</button></div></div></div>`).join(''):'<p class="muted">Noch keine Buchungen.</p>'}</div>`};function stats(){let now=new Date(),series=[];for(let i=5;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1),key=d.toISOString().slice(0,7);let sum=state.transactions.filter(t=>t.date.slice(0,7)===key).reduce((a,t)=>a+t.amount,0);series.push({name:d.toLocaleDateString('de-CH',{month:'short'}),sum})}let max=Math.max(1,...series.map(s=>Math.abs(s.sum)));return `<h2>Deine Statistiken</h2><div class="grid"><div class="stat"><span class="muted tiny">Gespart gesamt</span><strong>${money(total())}</strong></div><div class="stat"><span class="muted tiny">Sparziele</span><strong>${state.goals.length}</strong></div><div class="stat"><span class="muted tiny">Monatlich nötig</span><strong>${money(state.goals.reduce((a,g)=>a+rate(g),0))}</strong></div></div><div class="card"><h3>Monatliche Netto-Einzahlungen</h3><p class="tiny muted">Letzte sechs Kalendermonate; Auszahlungen werden abgezogen.</p>${series.map(s=>`<div class="barrow"><span>${esc(s.name)}</span><div class="bar"><div style="width:${100*Math.abs(s.sum)/max}%;background:${s.sum<0?'#b87c70':'#a5a88b'}"></div></div><strong>${money(s.sum)}</strong></div>`).join('')}</div><div class="card"><h3>Meilensteine</h3>${state.goals.length?state.goals.map(g=>`<p><strong>${esc(g.name)}</strong><br><span class="muted tiny">${milestones.filter(m=>percent(g)>=m).map(m=>'🏅 '+m+' %').join(' · ')||'Noch kein Meilenstein – weiter so!'}</span></p>`).join(''):'<p class="muted">Noch keine Sparziele.</p>'}</div>`}function settings(){return `<h2>Einstellungen & Datensicherung</h2><div class="card"><h3>Erinnerungen</h3><p class="muted tiny">Die App zeigt eine freundliche Erinnerung, wenn du sie öffnest und in den letzten 7 Tagen keine Buchung eingetragen hast. Keine Hintergrund-Push-Nachrichten.</p><label style="display:flex;align-items:center;gap:10px"><input id="reminderToggle" type="checkbox" ${state.reminders?'checked':''}> Erinnerungen beim Öffnen aktivieren</label></div><div class="card"><h3>Deine Daten</h3><p class="muted tiny">Alle Einträge bleiben im lokalen Speicher dieses Browsers. Exportiere regelmässig ein Backup. Beim Löschen von Safari-Website-Daten können sie verloren gehen.</p><div class="actions"><button class="btn" data-action="export">Backup herunterladen</button><button class="btn secondary" data-action="import">Backup importieren</button><button class="btn danger" data-action="reset">Alle Daten löschen</button></div><input class="hidden" type="file" id="importFile" accept="application/json,.json"></div><div class="notice">🔒 Keine Anmeldung, keine Bankverbindung, kein Tracking und keine Übertragung an einen Server. Verwende für private Daten einen vertrauenswürdigen Hosting-Anbieter und sichere deine Daten selbst.</div>`}function render(){for(let t of ['dashboard','goals','stats','settings'])$(t).classList.toggle('hidden',tab!==t);$('dashboard').innerHTML=dashboard();$('goals').innerHTML=goals();$('stats').innerHTML=stats();$('settings').innerHTML=settings();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const toggle=$('reminderToggle');if(toggle)toggle.onchange=e=>{state.reminders=e.target.checked;save();toast('Einstellung gespeichert.')};const file=$('importFile');if(file)file.onchange=importFile}function openForm(title,html,onSubmit){$('modalTitle').textContent=title;$('modalForm').innerHTML=html+'<div class="formfoot"><button type="button" class="btn secondary" id="cancelForm">Abbrechen</button><button type="submit" class="btn">Speichern</button></div>';$('cancelForm').onclick=()=>$('modal').close();$('modalForm').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.currentTarget))};$('modal').showModal()}function goalForm(id){let g=state.goals.find(g=>g.id===id);openForm(g?'Sparziel bearbeiten':'Neues Sparziel',`<label for="name">Name des Sparziels</label><input id="name" name="name" maxlength="70" required placeholder="z. B. Traumferien" value="${esc(g?.name||'')}"><label for="target">Zielbetrag in CHF</label><input id="target" name="target" type="number" min="0.01" step="0.01" required value="${g?.target||''}"><label for="deadline">Wunschdatum</label><input id="deadline" name="deadline" type="date" required value="${g?.deadline||''}">${g?'<p class="tiny muted">Zum Löschen eines Ziels zuerst die Buchungen sichern.</p><button type="button" class="btn danger" id="deleteGoal">Ziel löschen</button>':''}`,f=>{let name=String(f.get('name')).trim(),target=Number(f.get('target')),deadline=String(f.get('deadline'));if(!name||!Number.isFinite(target)||target<=0||!/^\d{4}-\d{2}-\d{2}$/.test(deadline)){toast('Bitte gültige Angaben eingeben.');return}if(g)Object.assign(g,{name,target,deadline});else state.goals.push({id:uid(),name,target,deadline});save();$('modal').close();render();toast(g?'Sparziel aktualisiert.':'Sparziel erstellt! ✨')});if(g)$('deleteGoal').onclick=()=>{if(confirm('Sparziel und ALLE zugehörigen Buchungen unwiderruflich löschen?')){state.goals=state.goals.filter(x=>x.id!==id);state.transactions=state.transactions.filter(t=>t.goalId!==id);save();$('modal').close();render()}}}function transactionForm(id,withdraw){let g=state.goals.find(g=>g.id===id);if(!g)return;openForm(withdraw?'Auszahlung':'Einzahlung',`<p class="muted tiny">${esc(g.name)} · Aktueller Stand: ${money(balance(id))}</p><label for="amount">Betrag in CHF</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" required><label for="date">Datum</label><input id="date" name="date" type="date" required value="${today()}"><label for="note">Notiz (optional)</label><input id="note" name="note" maxlength="120" placeholder="z. B. Monatsersparnis">`,f=>{let amount=Number(f.get('amount')),date=String(f.get('date'));if(!Number.isFinite(amount)||amount<=0||!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('Bitte gültigen Betrag und Datum eingeben.');return}if(withdraw&&amount>balance(id)){toast('Auszahlung übersteigt das Guthaben.');return}let old=percent(g);state.transactions.push({id:uid(),goalId:id,amount:withdraw?-amount:amount,date,note:String(f.get('note')).trim(),created:Date.now()});save();$('modal').close();render();let hit=milestones.filter(m=>old<m&&percent(g)>=m);toast(hit.length?`🏅 Glückwunsch! ${hit.at(-1)} % erreicht!`:withdraw?'Auszahlung gespeichert.':'Einzahlung gespeichert! 🌿')})}function exportFile(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),goals:state.goals,transactions:state.transactions,reminders:state.reminders},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`dreamsave-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup erstellt. Bitte sicher aufbewahren.')}async function importFile(e){let file=e.target.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.goals)||!Array.isArray(data.transactions)||data.goals.some(g=>typeof g.id!=='string'||typeof g.name!=='string'||!Number.isFinite(g.target)||g.target<=0||!/^\d{4}-\d{2}-\d{2}$/.test(g.deadline))||data.transactions.some(t=>typeof t.id!=='string'||typeof t.goalId!=='string'||!Number.isFinite(t.amount)||typeof t.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.date))||data.transactions.some(t=>!data.goals.some(g=>g.id===t.goalId)))throw Error('Ungültige Sicherung');if(confirm('Aktuelle Daten vollständig durch dieses Backup ersetzen?')){state={goals:data.goals,transactions:data.transactions,reminders:!!data.reminders,lastReminder:''};save();render();toast('Backup importiert.')}}catch(err){toast('Backup konnte nicht gelesen werden.')}e.target.value=''}document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let {action,id}=b.dataset;if(action==='new')goalForm();if(action==='edit')goalForm(id);if(action==='deposit')transactionForm(id,false);if(action==='withdraw')transactionForm(id,true);if(action==='deleteTransaction'&&confirm('Diese Buchung löschen?')){state.transactions=state.transactions.filter(t=>t.id!==id);save();render()}if(action==='export')exportFile();if(action==='import')$('importFile').click();if(action==='reset'&&confirm('Wirklich alle Sparziele und Buchungen unwiderruflich löschen?')){state={goals:[],transactions:[],reminders:false,lastReminder:''};save();render()}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});$('newGoalTop').onclick=()=>goalForm();$('closeModal').onclick=()=>$('modal').close();render();if(state.reminders&&state.goals.length&&state.lastReminder!==today()){let latest=state.transactions.reduce((a,t)=>t.date>a?t.date:a,'');if(!latest||(new Date(today())-new Date(latest))/86400000>=7){setTimeout(()=>toast('🌿 Kleine Erinnerung: Ein Sparschritt diese Woche?'),500);state.lastReminder=today();save()}}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
